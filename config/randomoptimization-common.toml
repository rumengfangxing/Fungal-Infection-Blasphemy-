#Whether to make item drop locations predictable
predictable_item_drops = true
#Whether to optimize structure locate progress, also fixes MC-249136. When enabled, the overlapping Shipwreck Fix mixins are disabled
structure_locate_speedup = true
#Whether to optimize resource looking up in compressed and path-based packs (GAME RESTART REQUIRED). Automatically disables overlapping resource-pack optimizations from ModernFix, Quick Pack, and lazyyyyyy
optimize_pack_lookup = true
#Whether to fix boat fall damage. When enabled, Boat Break Fix's overlapping boat mixin is disabled
fix_boat_fall_damage = true
#Whether to delay the load of DFU
lazy_dfu = true

