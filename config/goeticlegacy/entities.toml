#Cross-mod servant compatibility; the corresponding mod must be installed.
#仆从跨模组兼容；须安装对应模组。
[servant_config]
	#Treat Iron's Spells and Spellbooks summons as servants; requires irons_spellbooks.
	#将Iron's Spells and Spellbooks的召唤物视作仆从；须安装irons_spellbooks。
	enableIronSpellsServants = true
	#Treat Modular Golems as servants; requires modulargolems.
	#将Modular Golems的傀儡视作仆从；须安装modulargolems。
	enableModularGolemsServants = true
	#Treat vanilla tameable animals, including Touhou Little Maids, as servants.
	#将原版可驯服动物（含车万女仆）视作仆从。
	enableVanillaTameableServants = true
	#Prevent Goety prisoners from selecting etherium ore for automatic mining; false allows it.
	#禁止Goety囚犯选择以太矿石进行自动采矿；false允许开采。
	disablePrisonerMiningEtheriumOre = false

	#Servant area-damage reduction inferred from actual damage events.
	#根据实际受击记录推断的仆从范围伤害减免。
	[servant_config.aoe_resistance]
		#Maximum inferred AOE reduction fraction at high confidence.
		#高可信AOE推断的减伤比例上限。
		#Range: 0.0 ~ 1.0
		maxReduction = 0.6
		#Growth coefficient of inferred AOE reduction with same-wave hit count.
		#同波受击数量对AOE减伤的增长系数。
		#Range: 0.0 ~ 10.0
		growthRate = 0.25

#--- Sage finale repulsion soft boundary ---
#--- 大贤者尾杀的排斥软结界 ---
[finale_soft_boundary]
	#Enable finale arena screen feedback and gradual return pressure. Creative and spectator players are excluded.
	#启用终幕场地屏幕反馈及渐进回场牵引；不影响创造和旁观玩家。
	enabled = true
	#Horizontal radius where return pressure begins, in blocks.
	#开始施加回场压力的水平半径，单位格。
	#Range: 8.0 ~ 256.0
	horizontalStart = 52.0
	#Horizontal radius for full return pressure, at least 1 block above the start.
	#回场压力达到全强度的水平半径，至少比起始值大1格。
	#Range: 9.0 ~ 320.0
	horizontalFull = 64.0
	#Height above the arena where downward pressure begins, in blocks.
	#开始施加下压的场地相对高度，单位格。
	#Range: 8.0 ~ 128.0
	heightStart = 16.0
	#Height above the arena for full downward pressure, at least 1 block above the start.
	#下压达到全强度的场地相对高度，至少比起始值大1格。
	#Range: 9.0 ~ 192.0
	heightFull = 22.0

