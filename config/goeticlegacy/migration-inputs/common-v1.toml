[bulwark]
	#达到渐近上限一半时所需的戍卫等级总和。
	#数值越大曲线越平缓（饱和越晚），数值越小越早进入饱和。
	#10.0 时低等级段与旧公式几乎一致（5 级仍为 20%）。
	#
	#范围: 1.0 ~ 1000.0  [默认: 10.0]
	#Range: 1.0 ~ 1000.0
	bulwarkHalfLevel = 10.0
	#戍卫减伤公式的渐近上限。减伤比例 = maxReduction * level / (halfLevel + level)。
	#多件装备的等级会累加后再代入曲线；低等级段接近线性，高等级段被压平，
	#无论等级总和叠到多高都只会无限接近上限，不会触发 100%（仆从无敌）。
	#
	#示例 (maxReduction=0.6, halfLevel=10):
	#  3 级 ≈ 13.8%   5 级 = 20%    10 级 = 30%
	#  50 级 = 50%    200 级 ≈ 57.1%   ∞ 级 = 60%
	#
	#范围: 0.05 ~ 0.95  [默认: 0.6]
	#Range: 0.05 ~ 0.95
	bulwarkMaxReduction = 0.6

