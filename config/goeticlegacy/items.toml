
[books]

	#Seer Almanack
	#枯黄历
	[books.seer_almanack]
		#--- Base / shared effects ---
		#Extra incoming-damage fraction per Voodoo Curse level.
		#--- 基础／共用效果 ---
		#巫毒之咒每级增加的承伤比例。
		#Range: 0.0 ~ 100.0
		seerMarkDamagePerLevel = 0.25
		#Make this Voodoo Curse vulnerability mutually exclusive with Erosion; false allows stacking.
		#巫毒之咒的此项易伤与侵蚀互斥；false允许叠加。
		seerMarkSuppressedByErosion = true
		#--- Night Cube corrections ---
		#Seer Almanack: soul energy cost per successful effect-sharing operation.
		#--- 暗夜立方修正 ---
		#枯黄历：每次成功共享效果消耗的灵魂能量。
		#Range: 0 ~ 1000000
		seerShareSoulCost = 5
		#Seer Almanack: effect-sharing cooldown per target, in game ticks.
		#枯黄历：对每个目标共享效果的冷却，单位游戏刻。
		#Range: 1 ~ 72000
		seerShareCooldownTicks = 100
		#Effect IDs excluded from sharing, in namespace:path format; an empty list adds no exclusions.
		#禁止共享的效果ID，格式为命名空间:路径；空列表不额外排除效果。
		seerEffectBlacklist = ["minecraft:invisibility", "minecraft:speed", "minecraft:jump_boost", "minecraft:slow_falling"]
		#Sharing sources: unrestricted = all; minecraft = vanilla; goety = Goety; vanilla = minecraft + goety.
		#共享来源：unrestricted为全部，minecraft为原版，goety为Goety，vanilla为原版加Goety。
		seerEffectSourceFilter = "unrestricted"

