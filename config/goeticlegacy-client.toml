
[client]
	#Focus overlay HUD 布局预设索引
	#0=旧默认(现按左中), 1=右中, 2=左下, 3=左中, 4=中央偏右, 5=快捷栏左, 6=快捷栏右
	#缺失 HUD 布局时使用；新默认在左侧中部 [默认: 3]
	#Range: 0 ~ 6
	focusOverlayPreset = 3

[holy_dot]
	#Holy Armor DOT 信息 overlay 总开关
	#设为 false 可完全隐藏 DOT 信息面板和护甲条金色边框 [默认: true]
	holyDotEnabled = true
	#Holy Armor DOT 信息面板布局预设索引
	#0=左下, 1=右下, 2=左上, 3=右上, 4=快捷栏左, 5=快捷栏右
	#可在游戏中通过 API 切换 [默认: 0]
	#Range: 0 ~ 5
	holyDotPreset = 0
	#Holy Armor DOT 护甲条金色边框独立开关
	#设为 false 仅隐藏护甲条金色边框，不影响 DOT 信息面板 [默认: true]
	holyDotHealthBorderEnabled = true

[prefab_visuals]
	#兼容旧版视觉开关：0=关闭，1~3 任意值=完整特效 [默认: 2]
	#Range: 0 ~ 3
	quality = 2
	#最多缓存/渲染的未建造方块幽灵数 [默认: 1024，范围: 0 ~ 4096]
	#Range: 0 ~ 4096
	maxGhostBlocks = 1024
	#同时进行的实体化覆盖动画数量上限 [默认: 768，范围: 0 ~ 2048]
	#Range: 0 ~ 2048
	maxAnimatedBlocks = 768
	domainEnabled = true
	musicEnabled = true

[tooltips]
	#钥匙之书（心灵之庭钥匙）的 tooltips 总开关
	#设为 false 时完全不显示该物品的任何 tooltip（默认）
	#设为 true 时恢复显示（含 F3+H 高级提示的字体矩阵回归块）
	#[默认: false]
	mindCourtKeyTooltips = false

[debug_diagnostics]
	#创造模式「遗响分类筛选」的诊断日志开关
	#开启后，每次筛选/重建分类按钮栏都会输出条目数量与槽位状态明细
	#仅用于排查蓝图分类显示问题，默认关闭 [默认: false]
	blueprintCategoryDiagnostics = false
	#镜面反射渲染的诊断日志开关
	#开启后输出镜面请求/清除/表面扫描/捕获状态等明细
	#仅用于排查镜面(如幽匿脉络镜像)渲染问题，默认关闭 [默认: false]
	mirrorReflectionDiagnostics = false
	#Local VFX preview commands, development environment only.
	vfxDebugEnabled = true
	#Mirror compatibility: AUTO uses backend policy; SAFE disables planar reflection; FULL enables legacy capture; OFF disables both
	#Allowed Values: AUTO, FULL, SAFE, OFF
	mirrorCompatibilityMode = "AUTO"
	#Independent scene copy override. TEXTURE_COPY is experimental and only for manual backend testing
	#Allowed Values: AUTO, FRAMEBUFFER_BLIT, TEXTURE_COPY, DISABLED
	mirrorSceneCopyMode = "AUTO"
	#Independent planar reflection override. FULL may hang unverified mobile drivers
	#Allowed Values: AUTO, FULL, DISABLED
	mirrorPlanarMode = "AUTO"

[lantern]
	#Enable client-side moving light from held lanterns without a shader pack [default: true]
	nativeDynamicLightEnabled = true

[spell_visuals]
	bloom = true
	sparks = true
	#Local background distortion; safely skipped when depth cannot be resolved.
	localWarp = true
	#Range: 8 ~ 256
	maxProjectiles = 128
	#Range: 0 ~ 512
	maxSparks = 192

