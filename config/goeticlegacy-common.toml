#════════════════════════════════════
# 暗夜契约卷轴配置
#════════════════════════════════════
#
#核心机制：与暗夜立方共鸣，所有效果仅在夜晚激活状态下生效
#- 夜色强度：随夜晚时间推移而增强的动态数值（0-1之间）
#- 午夜爆发：每天0:00触发的短时间强力增益窗口
#- 假夜晚：通过主动技能创造的夜晚状态，提供额外收益
#- 月相系统：不同月相提供差异化的增益效果
#
[night_scroll]
	#夜色强度指数系数
	#- 计算公式：boosted = strength^power
	#- 值越小，曲线越平缓，低强度时收益更高
	#- 值越大，曲线越陡峭，高强度时收益更高
	#- 推荐范围：0.5-0.9 [默认: 0.7]
	#Range: 0.0 ~ 10.0
	nightStrengthPower = 0.7
	#夜色强度最低保底值
	#- 防止夜色强度过低时完全无效
	#- 取值范围：0.0-1.0 [默认: 0.35]
	#Range: 0.0 ~ 1.0
	nightStrengthMin = 0.35
	#午夜Buff效果持续时间（内部使用，无需调整）
	#- 该效果每刻都会重新添加，时长仅需保证不中断即可
	#Range: 1 ~ 72000
	buffDuration = 40
	#午夜Buff效果等级（核心配置）
	#- 0 = I级, 1 = II级, 2 = III级, 3 = IV级
	#- 等级越高，增益效果越强
	#- 推荐范围：0-5 [默认: 3 = IV级]
	#Range: 0 ~ 255
	buffAmplifier = 3
	#假夜晚斗志效果持续时间（内部使用，无需调整）
	#- 该效果每刻都会重新添加，时长仅需保证不中断即可
	#Range: 1 ~ 72000
	rallyingDuration = 60
	#假夜晚斗志效果等级（核心配置）
	#- 0 = I级, 1 = II级, 2 = III级
	#- 推荐范围：0-3 [默认: 2 = III级]
	#Range: 0 ~ 255
	rallyingAmplifier = 2
	#基于夜色强度的最终伤害加成系数
	#- 实际加成 = 配置值 × 当前夜色强度
	#- 例如：配置0.15，夜色强度0.8 → 实际加成12%
	#- 取值范围：0.0-100.0 [默认: 0.15 = 最大15%加成]
	#Range: 0.0 ~ 100.0
	finalDamageMultiplier = 0.15
	#夜色下的真实伤害转化比例（受夜色强度影响）
	#- 将部分伤害转化为无视防御的真实伤害
	#- 实际值 = 配置值 × 夜色强度
	#- 例如：0.10 × 0.8 = 8%转化为真伤
	#- 取值范围：0.0-1.0 [默认: 0.10 = 最大10%]
	#Range: 0.0 ~ 1.0
	trueDamageRatio = 0.1
	#午夜爆发时的额外最终伤害加成（固定值）
	#- 在午夜0:00时刻额外提供的伤害加成
	#- 不与夜色强度相乘，直接叠加
	#- 取值范围：0.0-100.0 [默认: 0.25 = +25%]
	#Range: 0.0 ~ 100.0
	finalDamageMultiplierMidnight = 0.25
	#夜色下魔法攻击无敌帧削减 [默认: 2.0 ticks]
	#Range: 0.0 ~ 100.0
	magicInvulBonus = 2.0
	#夜色下生命恢复间隔（ticks） [默认: 60 = 3秒]
	#Range: 1 ~ 1200
	nightHealInterval = 60
	#夜色下每次恢复最大生命值的百分比 [默认: 0.02 = 2%]
	#Range: 0.0 ~ 1.0
	nightHealPercent = 0.02
	#手持无名魔杖时的魔法伤害乘数加成
	#- 仅在主手或副手持有无名魔杖时生效
	#- 例如：0.15 = +15%魔法伤害
	#- 取值范围：0.0-100.0 [默认: 0.15 = +15%]
	#Range: 0.0 ~ 100.0
	magicDamageMultiplierStaff = 0.15
	#佩戴完整无名套装时的仆从减伤率
	#- 需要同时佩戴无名披风和无名王冠
	#- 例如：0.10 = 仆从受到的伤害减少10%
	#- 取值范围：0.0-1.0 [默认: 0.10 = 10%]
	#Range: 0.0 ~ 1.0
	servantDamageReductionNameless = 0.1
	#夜晚状态下玩家受伤倍率
	#- 值越小，减伤越多
	#- 例如：0.85 = 受到85%伤害（减伤15%）
	#- 取值范围：0.0-1.0 [默认: 0.85 = 减伤15%]
	#Range: 0.0 ~ 1.0
	playerHurtMultiplier = 0.85
	#假夜晚状态下的额外受伤倍率（在夜晚减伤基础上叠加）
	#- 计算公式：最终受伤 = 原始伤害 × playerHurtMultiplier × fakeNightHurtMultiplier
	#- 例如：0.85 × 0.80 = 0.68，即总减伤32%
	#- 取值范围：0.0-1.0 [默认: 0.80]
	#Range: 0.0 ~ 1.0
	fakeNightHurtMultiplier = 0.8

