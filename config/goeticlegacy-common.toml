#
#╔═══════════════════════════════════════════════════════════╗
#║                   生灵颂词 机制总览                      ║
#╚═══════════════════════════════════════════════════════════╝
#
#【核心行为】
#玩家与己方仆从之间双向共享正面药水效果（MobEffect）。
#同步方向：玩家→仆从 和 仆从→玩家，双方的效果都会向对方传播。
#
#【触发频率】
#每 5 tick（0.25 秒）检测一次，但每个 (源, 目标, 效果) 组合
#有独立的冷却（syncCooldownTicks），冷却期内不会重复同步同一效果。
#默认冷却 100 tick（5 秒），可防止 buff 被无限刷新。
#
#【等级处理】
#共享时等级 = 向上取整减半：(originalAmplifier + 1) / 2
#例如：源效果 V级(amp=4) → 共享后 III级(amp=2)
#      源效果 II级(amp=1) → 共享后 I级(amp=0)
#      源效果 I级(amp=0) → 共享后 I级(amp=0)
#
#共享后的等级受 maxSharedAmplifier 封顶（默认 amp=3，即 IV级）。
#注意：amplifier 值 0=I级, 1=II级, 2=III级, 3=IV级，以此类推。
#
#【时长处理】
#共享后的时长 = max(minDuration, originalDuration / 2)，
#即原有时长减半，但不低于 minDuration（默认 20 tick = 1 秒）。
#若原效果为无限时长（-1），则共享后仍为无限。
#
#【灵魂消耗】
#任意一个同步方向实际发生了效果共享时，消耗 soulCostPerTick 点灵魂能量。
#（默认为 5 点灵魂能量每次）
#
#【过滤层（按顺序执行）】
#第一层 — 来源过滤（effectSourceFilter）：
#  按效果所属的命名空间（namespace）过滤。
#  四种模式见下方配置说明，默认 unrestricted 不限制。
#
#第二层 — 黑名单过滤（effectBlacklist）：
#  按具体的效果 ID 排除，精确匹配 ResourceLocation。
#  默认黑名单：minecraft:invisibility, speed, jump_boost, slow_falling
#  留空 [] 则不禁任何效果。
#
#第三层 — I 级效果过滤（shareLevelOne）：
#  设为 false 时，amplifier=0（I 级）的效果不会被共享。
#  这在不想传播低级 buff（如 I 级力量、I 级速度）时很有用。
#  默认 true（I 级也共享）。
#
#【防递归】
#若目标已有同种效果且 amplifier >= 即将共享的等级，则跳过同步。
#这防止了玩家↔仆从之间不断互相传播导致的死循环。
#
#═══════════════════════════════════════════════════════════
[ode_to_living]
	#每 tick 同步效果时消耗的灵魂能量 [默认: 5]
	#Range: 0 ~ 10000
	soulCostPerTick = 5
	#共享效果的持续时间（ticks） [默认: 200 = 10秒]
	#Range: 20 ~ 72000
	sharedDuration = 200
	#时长减半后最短保留的时间（ticks） [默认: 20 = 1秒]
	#Range: 1 ~ 72000
	minDuration = 20
	#共享药水效果的最大 amplifier 等级（0=I级，3=IV级），超过此值的会被压制到上限 [默认: 3]
	#Range: 0 ~ 255
	maxSharedAmplifier = 3
	#是否共享 amplifier=0（I级）的药水效果。
	#false 时仅同步 II 级及以上的效果，I 级效果不会共享。
	#[默认: true]
	shareLevelOne = true
	#共享效果的来源过滤模式。可选值：
	#  unrestricted — 无限制，共享所有来源的药水效果（默认）
	#  minecraft — 仅共享 minecraft 命名空间的原版药水效果
	#  goety — 仅共享 goety 命名空间的药水效果
	#  vanilla — 仅共享 minecraft + goety 命名空间的药水效果
	#
	#选择后，不在白名单命名空间内的药水效果不会被共享。
	#此配置为热重载，修改后无需重启服务器。
	#[默认: "unrestricted"]
	effectSourceFilter = "unrestricted"
	#禁止共享的药水效果 ID 列表（ResourceLocation 格式），
	#填入模组命名空间 ID 即可，例如: ["minecraft:invisibility"]
	#留空则不禁止任何效果 [默认: ["minecraft:invisibility", "minecraft:speed", "minecraft:jump_boost", "minecraft:slow_falling"]]
	effectBlacklist = ["minecraft:invisibility", "minecraft:speed", "minecraft:jump_boost", "minecraft:slow_falling"]

[ode_to_living_sync_cooldown]
	#同步冷却机制的冷却时长（ticks，20 ticks = 1 秒）
	#每次效果同步后，必须等待冷却期满才能再次同步同一效果。
	#防止 buff 被不断刷新至永续。
	#[默认: 100 = 5 秒]
	#Range: 1 ~ 72000
	syncCooldownTicks = 100

