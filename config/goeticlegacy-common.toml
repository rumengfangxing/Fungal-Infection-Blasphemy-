#════════════════════════════════════
# 预制建筑
#════════════════════════════════════
#蓝图按照三个层级注入战利品表：
#  Tier 1 - 原版箱子（*:chests/*，不含 goety）
#  Tier 2 - Goety 系列箱子（命名空间含 goety）
#  Tier 3 - 宝藏袋 / 自定义战利品表
#
#爆率计算公式：
#  每个蓝图按自身 dropWeight 参与加权随机，
#  概率 = 该蓝图dropWeight / (所有蓝图dropWeight之和 + emptyWeight)
#  其中 emptyWeight = 总权重 * (1 - chance) / chance
#
#示例：dropWeight=20 的蓝图在 5% 爆率下：
#  假设总权重=100 → emptyWeight=1900 → 单蓝图概率 ≈ 20/2000 ≈ 1%
#
#建议值：
#  vanillaChestChance:  0.05 (5%)  → 平均 20 个箱子出 1 张
#  goetyChestChance:    0.15 (15%) → 平均 6-7 个箱子出 1 张
#  treasurePouchChance: 0.66 (66%) → 平均 1.5 个袋子出 1 张
#
[prefab_loot]
	#Tier 1: 原版箱子的蓝图爆率 (0.0=关闭, 1.0=必出)
	#作用于所有命名空间不含 "goety" 且路径以 chests/ 开头的战利品表
	#[默认: 0.05]
	#Range: 0.0 ~ 1.0
	vanillaChestChance = 0.05
	#Tier 2: Goety 系列箱子的蓝图爆率 (0.0=关闭, 1.0=必出)
	#作用于命名空间含 "goety" 且路径以 chests/ 开头的战利品表
	#[默认: 0.1]
	#Range: 0.0 ~ 1.0
	goetyChestChance = 0.1
	#Tier 3: 宝藏袋/自定义战利品表的蓝图爆率 (0.0=关闭, 1.0=必出)
	#作用于下方 treasurePouchIds 列表中的战利品表 ID
	#[默认: 0.45]
	#Range: 0.0 ~ 1.0
	treasurePouchChance = 0.45
	#═══════════════════════════════════════════════
	# 宝藏袋战利品表 ID 列表
	#═══════════════════════════════════════════════
	#
	#在此列表中的战利品表 ID 会应用 Tier 3 的爆率。
	#格式："modid:path"，一行一个。
	#
	#默认值：
	#  "goety:gameplay/treasure_pouch" — Goety 宝藏袋
	#
	#你可以加入其他模组的宝藏袋/奖励袋 ID：
	#  "irons_spellbooks:gameplay/reward_pouch"
	#  "cataclysm:gameplay/loot_bag"
	#
	treasurePouchIds = ["goety:gameplay/treasure_pouch"]

#控制哪些实体类型可以被预制建筑系统捕获（创建蓝图/收回建筑时）。
#格式: modid:entity_type，例如 minecraft:painting
#
#支持的实体必须是不依赖运行时状态的纯装饰实体。
#白名单外的实体在快照时将被忽略，避免 NBT 残留导致崩溃。
[prefab_entity]
	#可被预制建筑蓝图捕获的实体列表。
	#默认包含：原版画/物品展示框/荧光展示框/盔甲架 + Goety 的 haunted 版本
	#添加其他模组实体前请确认其 NBT 不包含动态引用（UUID、Passengers 等）
	capturableEntities = ["minecraft:item_frame", "minecraft:glow_item_frame", "minecraft:painting", "minecraft:armor_stand", "goety:haunted_painting", "goety:haunted_armor_stand"]

#---- 预制建筑通用配置 ----
#控制 CREATE 捕获模式、动画速度、灵魂消耗等。
#
[prefab_config]
	#CREATE 捕获模式允许的最大单轴尺寸（方块数）。
	#注意：实际可创建的方块数受灵魂能量上限制约（soulCostRatioCap）。
	#增大此值会增加预览网络包大小和动画时长。
	#[默认: 64] [范围: 16 ~ 256]
	#Range: 16 ~ 256
	maxCreateSize = 128
	#生存模式下 CREATE 捕获的最大单轴尺寸（方块数）。
	#创造模式不受此限制（使用上方 maxCreateSize）。
	#[默认: 48] [范围: 8 ~ 128]
	#Range: 8 ~ 128
	survivalMaxCreateSize = 48
	#部署/收回动画每 tick 最多处理的方块数。
	#增大此值可加快大建筑动画速度，但会增加每 tick 的服务端开销。
	#20 = 原版默认速度，120 ≈ 5 分钟处理 240k 方块。
	#[默认: 120] [范围: 20 ~ 500]
	#Range: 20 ~ 500
	maxBlocksPerTick = 120
	#每放置一个非空气方块消耗的灵魂能量倍率。
	#最终消耗 = ceil(方块数 × 此值)，再受 soulCostRatioCap 限制。
	#[默认: 0.5] [范围: 0.01 ~ 10.0]
	#Range: 0.01 ~ 10.0
	soulCostPerBlock = 0.5
	#动画目标总时长（tick，20 tick = 1 秒）。
	#小建筑快速完成，大建筑渐近趋向此值。6000 = 5 分钟。
	#[默认: 6000] [范围: 600 ~ 24000]
	#Range: 600 ~ 24000
	targetJobTicks = 6000
	#预览包切换为外轮廓模式的方块数阈值。
	#当非空气方块数超过此值时，预览只发送建筑表面方块以减小包体积。
	#设为 0 强制始终外轮廓；设为极大值禁用外轮廓。
	#[默认: 5000] [范围: 0 ~ 1000000]
	#Range: 0 ~ 1000000
	previewOutlineThreshold = 5000
	#单次部署的灵魂消耗占玩家最大灵魂能量的比例上限。
	#eg. 0.8 = 最多消耗 80% 的灵魂上限。此值独立于 maxCreateSize，
	#即使配置允许更大的选区，灵魂消耗也不会超过此上限。
	#[默认: 0.8] [范围: 0.1 ~ 1.0]
	#Range: 0.1 ~ 1.0
	soulCostRatioCap = 1.0

#════════════════════════════════════
# 初始建筑（Starter）
#════════════════════════════════════
#---- 初始建筑（Starter） ----
#新玩家首次登录时自动获得的预制建筑蓝图。
#
[starter_config]
	#发放模式：
	#  "all"    — 给予 starters/ 目录下的所有初始建筑
	#  "random" — 随机选择一个初始建筑（默认）
	#  "none"   — 禁用初始建筑发放
	#[默认: random]
	starterMode = "random"
	#初始建筑模板存放目录（相对于 config/）
	#此目录下的 .nbt 或 .schematic 文件将作为初始建筑发放。
	#首次运行时自动从 JAR 内置 resources 复制示例模板。
	#[默认: goeticlegacy/starters]
	starterPath = "goeticlegacy/starters"

